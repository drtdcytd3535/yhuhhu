server.port=8081

# ============ 数据源（本地 MySQL：root / 123456） ============
# createDatabaseIfNotExist=true 让数据库不存在时自动创建（重启重置后免手动建库）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/spring_boot_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ============ 自动建表（幂等：CREATE TABLE IF NOT EXISTS） ============
# 开机重置导致表丢失时，后端启动会自动补建，无需手动执行 sql/init.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.encoding=UTF-8

# ============ MyBatis-Plus ============
# 开启 SQL 日志，方便联调
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 驼峰转下划线（createdAt -> created_at）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 全局默认逻辑删除字段（本表未启用，保留配置位）
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-prefix=
